[package]
name = "dbt-fleet"
version = "0.0.2"
edition = "2021"
rust-version = "1.75"
description = "Governance scoring and trends for dbt projects. CI-native, milliseconds, MIT."
authors = ["Dare Sunday"]
license = "MIT"
repository = "https://github.com/dreynow/dbt-fleet"
homepage = "https://github.com/dreynow/dbt-fleet"
documentation = "https://github.com/dreynow/dbt-fleet"
readme = "README.md"
keywords = ["dbt", "governance", "data-quality", "ci", "analytics-engineering"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dbt-fleet"
path = "src/main.rs"

[lib]
name = "dbt_fleet"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
globset = "0.4"
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
