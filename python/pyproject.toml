[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-fleet"
version = "0.1.2"
description = "Governance scoring and trends for dbt projects. CI-native, milliseconds, MIT."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dare Sunday" }]
keywords = ["dbt", "governance", "data-quality", "ci", "analytics-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dreynow/dbt-fleet"
Repository = "https://github.com/dreynow/dbt-fleet"
Issues = "https://github.com/dreynow/dbt-fleet/issues"
Changelog = "https://github.com/dreynow/dbt-fleet/blob/main/CHANGELOG.md"

[project.scripts]
dbt-fleet = "dbt_fleet._binary:main"

[tool.setuptools.packages.find]
include = ["dbt_fleet*"]
